<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTICAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        ul {
            list-style-type: none;
            width: 30%;
            margin: auto;
            margin-top: 100px;

        }

        ul>li {
            padding: 15px;
            background-color: yellow;
            text-align: center;



        }

        ul>li:hover {
            background-color: hotpink;
            cursor: pointer;
        }




        ul>li>a {
            text-decoration: none;
            font-family: inherit;
            font-size: 18px;
            color: black;
            font-weight: bold;


        }

        ul>li:nth-child(1){
            background-color: aquamarine;
        }

        h1{
            
            margin-top: 100px;
            margin-left: 500px;
            font-family: inherit;
            background-color: tomato;
            color: #fff;
            text-align: center;
            display: inline-block;
            
            
        }
    </style>
</head>

<body>

    <h1>CSS NAVIGATION BAR(VERTICAL)</h1>

    <ul>
        <li><a href="#"><i class="fa-solid fa-house"></i><br>Home</a></li>
        <li><a href="#"><i class="fa-regular fa-newspaper"></i><br>News</a></li>
        <li><a href="#"><i class="fa-solid fa-phone"></i><br>Contact</a></li>
        <li><a href="#"><i class="fa-regular fa-address-card"></i><br>About</a></li>
    </ul>

</body>

</html>
