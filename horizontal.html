<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORIZONTAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        ul {
            list-style-type: none;
            width: 100%;
            margin: auto;
            margin-top: 100px;
            margin-left: 400px;


        }

        ul li {
            display: inline;
            background-color: yellow;
            padding: 25px;
            margin-right: 25px;

        }

        ul li a {
            font-family: inherit;
            font-size: 18px;
            text-decoration: none;
            text-decoration-line: none;
            font-weight: bold;
            color: black;

        }

        ul>li:hover {
            background-color: hotpink;
            cursor: pointer;
        }


        i {
            padding-right: 6px;
        }

        ul>li:nth-child(1) {
            background-color: #03fc24;
        }

        h1 {

            margin-top: 50px;
            margin-left: 420px;
            font-family: inherit;
            background-color: tomato;
            color: #fff;
            text-align: center;
            display: inline-block;


        }

     

       
        
    </style>
</head>

<body>
    <h1>CSS NAVIGATION BAR(HORIZONTAL)</h1>
    <ul>
        <li><a href="#"><i class="fa-solid fa-house"></i>Home</a></li>
        <li><a href="#"><i class="fa-regular fa-newspaper"></i>News</a></li>
        <li><a href="#"><i class="fa-solid fa-phone"></i>Departments</a></li>
        <li><a href="#"><i class="fa-regular fa-address-card"></i>About</a></li>
    </ul>
</body>

</html>
